name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run primary tests without legacy modules
        env:
          MGF_DISABLE_LEGACY: "1"
        run: python -m pytest -q --ignore=tests/compatibility

      - name: Run dedicated compatibility suite
        run: python -m pytest -q tests/compatibility

      - name: Build distribution
        run: |
          python -m pip install build
          python -m build

      - name: Test installed wheel outside the checkout
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          wheel_smoke_dir=$(mktemp -d)
          cp scripts/check_installed_wheel.py examples/migration.py app.py "$wheel_smoke_dir/"
          cp -R data "$wheel_smoke_dir/data"
          cd "$wheel_smoke_dir"
          python check_installed_wheel.py --checkout "$GITHUB_WORKSPACE"
